<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>PineChar — Weekly goals</title>
    <style>
      /* Popups size to their content, so the width here is what sets the
         popup's width. Min/max keeps it sane when opened as a full tab too. */
      body {
        font: 14px system-ui, sans-serif;
        margin: 12px;
        min-width: 320px;
        max-width: 480px;
      }
      h1 {
        font-size: 15px;
        margin: 0 0 8px;
      }
      textarea {
        width: 100%;
        box-sizing: border-box;
        min-height: 140px;
        font: inherit;
      }
      #status {
        color: #666;
        margin: 8px 0 0;
        min-height: 1em;
      }

      /* Kept well away from Save: this one is destructive and not part of the
         normal flow. */
      .dev {
        margin-top: 18px;
        padding-top: 10px;
        border-top: 1px solid #e2e4e8;
      }
      #reset {
        font: inherit;
        font-size: 12px;
        padding: 3px 8px;
        color: #7a1c1c;
        background: #fff;
        border: 1px solid #e0c4c4;
        border-radius: 6px;
        cursor: pointer;
      }
      #reset:disabled {
        opacity: 0.5;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <h1>Weekly goals</h1>
    <textarea
      id="goals"
      placeholder="What are you trying to get done this week?"
    ></textarea>
    <button id="save">Save goals</button>
    <p id="status"></p>
    <div class="dev">
      <button id="reset" type="button">Clear history (dev)</button>
    </div>
    <script src="goals.js"></script>
  </body>
</html>
